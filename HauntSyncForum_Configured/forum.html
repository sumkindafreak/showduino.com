<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HauntSync Forum — Showduino</title>
  <link rel="stylesheet" href="style.css">

  <!-- Firebase SDKs (Compat version) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCbBK1hwavHkKopd6cycSXOc8QQQhVPWYU",
      authDomain: "hauntsync-forum-4b992.firebaseapp.com",
      projectId: "hauntsync-forum-4b992",
      storageBucket: "hauntsync-forum-4b992.appspot.com",
      messagingSenderId: "525589326062",
      appId: "1:525589326062:web:cfa0d7dc272c292fbb2840"
    };
    firebase.initializeApp(firebaseConfig);
  </script>
</head>
<body>

  <header class="forum-header">
    <h1>🕯️ HauntSync Forum</h1>
    <nav class="forum-nav">
      <a href="index.html">Portal</a>
      <a href="../hauntsync.html">← HauntSync</a>
      <a href="../index.html">Home</a>
      <button onclick="logout()" class="secondary" style="padding:0.35rem 0.85rem; font-size:0.75rem;">Logout</button>
    </nav>
  </header>

  <div class="forum-container">

    <div class="forum-card">
      <h2>Ritual Profile</h2>
      <label for="ritual-persona">Display Name</label>
      <input id="ritual-persona" type="text" placeholder="Your ritual name">
      <label for="ritual-haunt">Haunt</label>
      <input id="ritual-haunt" type="text" placeholder="Your haunt name">
      <label for="ritual-sigil">Sigil URL (optional)</label>
      <input id="ritual-sigil" type="text" placeholder="https://...">
      <button onclick="saveRitualProfile()">Save Profile</button>
    </div>

    <div class="forum-card">
      <h2>💬 Start a Thread</h2>
      <label for="thread-content">Your message</label>
      <textarea id="thread-content" rows="4" placeholder="Share issues, debug info, show ideas..."></textarea>
      <button onclick="postThread()">Post Thread</button>
    </div>

    <div class="forum-card">
      <h2>📜 Latest Threads</h2>
      <ul id="threads-list">
        <li class="thread-item" style="color:#555; font-style:italic;">Loading threads...</li>
      </ul>
    </div>

  </div>

  <script src="forum.js"></script>
</body>
</html>
