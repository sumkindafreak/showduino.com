name: Website static smoke
on:
  pull_request:
    paths:
      - '**/*.html'
      - 'css/**'
      - 'js/**'
      - 'app.js'
      - 'tools/**'
      - '_headers'
      - '_redirects'
      - 'tests/site-security-config.test.cjs'
      - '.github/workflows/website-static-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check asset paths, Studio navigation and JavaScript syntax
        run: |
          node tools/check-website.mjs
          node tests/hauntsync-onboarding.test.cjs
          node tests/hauntsync-google-auth.test.cjs
          node tests/site-security-config.test.cjs
