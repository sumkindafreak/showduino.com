<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HauntSync Portal — Showduino</title>
  <link rel="stylesheet" href="style.css">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>

  <header class="forum-header">
    <h1>🕯️ HauntSync Portal</h1>
    <nav class="forum-nav">
      <a href="../hauntsync.html">← HauntSync</a>
      <a href="forum.html">Forum</a>
      <a href="../index.html">Home</a>
    </nav>
  </header>

  <div class="forum-container">

    <div class="forum-card">
      <h2>Welcome to HauntSync</h2>
      <p style="color:#aaa; line-height:1.7;">
        Create your ritual profile, join the community, and synchronise your Showduino shows with the cloud.
        Register below or log in if you already have an account.
      </p>
    </div>

    <div class="forum-card" id="auth-section">
      <h2>Sign In / Register</h2>
      <label for="name">Your Name</label>
      <input id="name" type="text" placeholder="e.g. GhostOps">

      <label for="haunt">Haunt Name (optional)</label>
      <input id="haunt" type="text" placeholder="e.g. Shadow Manor">

      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com">

      <label for="password">Password</label>
      <input id="password" type="password" placeholder="••••••••">

      <div style="display:flex; gap:0.75rem; flex-wrap:wrap; margin-top:0.5rem;">
        <button id="registerBtn">Register</button>
        <button id="loginBtn" class="secondary">Login</button>
      </div>

      <p id="auth-message" style="color:var(--error-color); margin-top:0.75rem; font-size:0.85rem;"></p>
    </div>

  </div>

  <script src="auth.js" defer></script>
</body>
</html>
