name: Website browser tests

# W001: real headless-Chromium tests of Studio against a local copy of the site.
# They never contact show-duino.com, Supabase or any Showduino hardware.
on:
  pull_request:
    paths:
      - 'studio.html'
      - 'app.js'
      - 'js/**'
      - 'css/**'
      - 'tests/browser/**'
      - '*.html'
      - '.github/workflows/website-browser-tests.yml'
  push:
    branches: [main, 'w002/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Hostile .shdo import executes no script (desktop and phone)
        run: node tests/browser/studio-import-injection.cjs
      - name: Every hostile string in an imported or stored project stays inert (all views, desktop and phone)
        run: node tests/browser/studio-hostile-import-fuzz.cjs
      - name: All pages load; pinned third-party scripts pass SRI
        run: node tests/browser/site-pages.cjs
      - name: HauntSync sign-in, sign-out, community download, cloud failure (mocked Supabase)
        run: node tests/browser/hauntsync-mocked-workflows.cjs
      - name: Creator publish / unpublish and hostile published values (mocked Supabase)
        run: node tests/browser/hauntsync-creator-publishing.cjs
      - name: Device-supplied audio file names and errors render as text (W002)
        run: node tests/browser/studio-device-filenames.cjs
      - name: Account panels reflect actual signed-in state on desktop and phone
        run: node tests/browser/account-visibility.cjs
      - name: Website account logout on desktop and phone
        run: node tests/browser/site-account.cjs
      - name: Mobile menu button on every public page
        run: node tests/browser/site-mobile-menu.cjs
      - name: Sounds panel - import, badges, persistence, use in cue, remove, phone
        run: node tests/browser/studio-sounds.cjs
      - name: Audio cues - local vs confirmed on the Audio Node, firmware name rule, export, deploy (W004)
        run: node tests/browser/studio-audio-confirmation.cjs
      - name: HauntSync community pages - roles, XSS, posting, reports, owner dashboard, phone (W004)
        run: node tests/browser/hauntsync-community-ui.cjs
      - name: Timeline touch gestures on a tablet - select, drag, trim, pinch zoom; mouse unchanged
        run: node tests/browser/studio-timeline-touch.cjs
      - name: Tablet Inspector slides in over the timeline; desktop column unchanged
        run: node tests/browser/studio-tablet-inspector.cjs
      - name: Studio import / export / reload / restore round trip
        run: node tests/browser/studio-roundtrip.cjs
      - name: Check out the P4 firmware SHDO compiler (new_showduino)
        uses: actions/checkout@v4
        with:
          repository: sumkindafreak/new_showduino
          # Head of new_showduino PR #35 (action.value parser fix + genuine Studio export tests).
          # Move to a main commit once #35 is merged.
          ref: 4a15557acb69d18acb020e3d313dd44473fa4f04
          path: firmware-src
          sparse-checkout: protocol
      - name: Build the firmware SHDO compiler for the host
        run: g++ -std=c++17 -I firmware-src/protocol tools/shdo-contract/shdo_check.cpp -o "$RUNNER_TEMP/shdo_check"
      - name: Studio P4 limits, compact export and firmware contract (W005)
        run: SHDO_CHECK_BIN="$RUNNER_TEMP/shdo_check" node tests/browser/studio-p4-limits.cjs
